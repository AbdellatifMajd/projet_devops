name: CI/CD Pipeline

# Déclencheur : Le pipeline se lance à chaque push sur la branche principale
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code du dépôt
    - name: Checkout source code
      uses: actions/checkout@v3

    # 2. Se connecter à Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.MAJD1_SECRET_NAME }}
        password: ${{ secrets.MAJD1_TOKEN }}

    # 3. Build & Push de l'image Backend (Spring Boot)
    - name: Build and Push Spring Boot Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ secrets.MAJD1_SECRET_NAME }}/projet_devops-backend:latest

    # 4. Build & Push de l'image Frontend (React)
    - name: Build and Push React Image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ secrets.MAJD1_SECRET_NAME }}/projet_devops-frontend:latest

